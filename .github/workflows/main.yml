name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Celeste Loader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Install mono
        run: sudo apt-get install mono-devel

      - name: Build Csproj
        run: |
          cd loader && dotnet workload restore && cd ..
          make publish

      - uses: actions/upload-artifact@v4
        with:
          name: webleste-loader
          path: frontend/dist/
          compression-level: 6

  upload:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all

    steps:
      - name: Delete old release and tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ github.token }}

      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
          name: webleste-loader
          path: dist/

      - name: Compress artifact
        run: tar cavf webleste-loader.tar.zst -C dist .

      - name: Release to GitHub
        uses: ncipollo/release-action@v1
        with:
          name: Continuous Build
          tag: latest
          commit: threads-v2
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: webleste-loader.tar.zst

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
          name: webleste-loader
          path: dist/

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
